# Servidor do piloto: invenire-server + PostgreSQL, subindo sozinhos com a
# máquina. Veja docs/piloto.md.
#
#   cp .env.example .env    # e preencha
#   docker compose up -d --build
#   docker compose exec server invenire-server status --tenant "Prefeitura"
#
# O PostgreSQL não fica exposto: só o servidor fala com ele, pela rede interna.
name: invenire-piloto

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: invenire
      POSTGRES_PASSWORD: ${INVENIRE_PG_PASSWORD:?defina INVENIRE_PG_PASSWORD no .env}
      POSTGRES_DB: invenire
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invenire -d invenire"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ../..
      args:
        VERSION: ${INVENIRE_VERSION:-piloto}
    image: invenire-server:${INVENIRE_VERSION:-piloto}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INVENIRE_DATABASE_URL: postgres://invenire:${INVENIRE_PG_PASSWORD}@postgres:5432/invenire?sslmode=disable
    command:
      - serve
      - --listen
      - :8443
      - --data
      - data
      - --hosts
      - ${INVENIRE_HOSTS:?defina INVENIRE_HOSTS no .env (nomes e IPs pelos quais as máquinas chamam o servidor)}
    ports:
      - "${INVENIRE_PORT:-8443}:8443"
    volumes:
      - data:/var/lib/invenire

volumes:
  pgdata:
  data:
