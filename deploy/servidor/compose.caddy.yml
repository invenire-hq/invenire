# invenire-server numa VPS do zero: Caddy na frente, com certificado do
# Let's Encrypt tirado e renovado sozinho. Basta um domínio apontando para a
# VPS e as portas 80 e 443 abertas. O servidor fala HTTP puro só com o Caddy,
# pela rede interna; nada dele é publicado. Roteiro: docs/instalar/vps.md.
#
#   cp .env.example .env    # e preencha (COMPOSE_FILE=compose.caddy.yml e INVENIRE_DOMAIN)
#   docker compose up -d --build --wait
#   docker compose logs server | grep "primeira configuração"
name: invenire-servidor

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: invenire
      POSTGRES_PASSWORD: ${INVENIRE_PG_PASSWORD:?defina INVENIRE_PG_PASSWORD no .env}
      POSTGRES_DB: invenire
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invenire -d invenire"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    # Ainda não há imagem publicada: --build monta a imagem a partir deste
    # repositório. Com uma imagem pronta, aponte INVENIRE_IMAGE para ela.
    image: ${INVENIRE_IMAGE:-invenire-server:dev}
    build:
      context: ../..
      args:
        VERSION: ${INVENIRE_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INVENIRE_DATABASE_URL: postgres://invenire:${INVENIRE_PG_PASSWORD}@postgres:5432/invenire?sslmode=disable
      # Opcional: código da primeira configuração fixo, em vez do gerado.
      INVENIRE_SETUP_CODE: ${INVENIRE_SETUP_CODE:-}
    command:
      - serve
      - --behind-proxy
      - --listen
      - :8080
      - --data
      - data
      # O Caddy conecta de dentro desta rede.
      - --trusted-proxies
      - 172.31.250.0/24
    volumes:
      - data:/var/lib/invenire
    healthcheck:
      test: ["CMD", "invenire-server", "health", "--url", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 6s
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - server
    environment:
      INVENIRE_DOMAIN: ${INVENIRE_DOMAIN:?defina INVENIRE_DOMAIN no .env (o domínio que aponta para esta máquina)}
    ports:
      - "80:80"      # o Let's Encrypt confere o domínio por aqui; o resto vai para HTTPS
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados e conta do Let's Encrypt: perdê-los obriga a tirar de
      # novo (e o Let's Encrypt limita quantos por semana).
      - caddy_data:/data
      - caddy_config:/config

networks:
  default:
    ipam:
      config:
        # Faixa fixa, para --trusted-proxies saber de onde vem o Caddy. Se
        # colidir com a sua rede, mude em todos os compose*.yml e acima.
        - subnet: 172.31.250.0/24

volumes:
  pgdata:
  data:
  caddy_data:
  caddy_config:
