# invenire-server atrás de um proxy reverso que já existe (Nginx, Caddy,
# Traefik…) e termina o TLS com um certificado público. O servidor fala HTTP
# puro, publicado só em 127.0.0.1, e o agente se autentica assinando cada
# requisição. Exemplo de Nginx em nginx/invenire.conf; roteiro em
# docs/instalar/proxy-reverso.md.
#
#   cp .env.example .env    # e preencha (COMPOSE_FILE=compose.proxy.yml)
#   docker compose up -d --build --wait
#   docker compose logs server | grep "primeira configuração"
#
# O agente cadastra pela URL pública, sem pin (o certificado é público).
name: invenire-servidor

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: invenire
      POSTGRES_PASSWORD: ${INVENIRE_PG_PASSWORD:?defina INVENIRE_PG_PASSWORD no .env}
      POSTGRES_DB: invenire
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invenire -d invenire"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    # Ainda não há imagem publicada: --build monta a imagem a partir deste
    # repositório. Com uma imagem pronta, aponte INVENIRE_IMAGE para ela.
    image: ${INVENIRE_IMAGE:-invenire-server:dev}
    build:
      context: ../..
      args:
        VERSION: ${INVENIRE_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INVENIRE_DATABASE_URL: postgres://invenire:${INVENIRE_PG_PASSWORD}@postgres:5432/invenire?sslmode=disable
      # Opcional: código da primeira configuração fixo, em vez do gerado.
      INVENIRE_SETUP_CODE: ${INVENIRE_SETUP_CODE:-}
    command:
      - serve
      - --behind-proxy
      - --listen
      - :8080
      - --data
      - data
      # De onde o proxy conecta. Com o proxy nesta mesma máquina, a conexão
      # chega pela porta publicada abaixo e aparece vinda do gateway da rede
      # do compose (172.31.250.1), que está nesta faixa. Com o proxy em outra
      # máquina, ponha o IP dela (e publique a porta num IP da rede local).
      - --trusted-proxies
      - ${INVENIRE_TRUSTED_PROXIES:-172.31.250.0/24}
    ports:
      # Só o proxy fala com o servidor: HTTP puro não sai desta máquina.
      - "${INVENIRE_BIND:-127.0.0.1}:${INVENIRE_HTTP_PORT:-8080}:8080"
    volumes:
      - data:/var/lib/invenire
    healthcheck:
      test: ["CMD", "invenire-server", "health", "--url", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 6s
      start_period: 20s

networks:
  default:
    ipam:
      config:
        # Faixa fixa, para --trusted-proxies saber de onde vem o proxy. Se
        # colidir com a sua rede, mude em todos os compose*.yml e em
        # INVENIRE_TRUSTED_PROXIES.
        - subnet: 172.31.250.0/24

volumes:
  pgdata:
  data:
