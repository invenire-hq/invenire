# PostgreSQL para desenvolvimento e testes (docs/desenvolvimento.md). Para
# instalar o servidor de verdade, veja deploy/servidor e docs/instalar.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# URL: postgres://invenire:invenire@localhost:5442/invenire?sslmode=disable
# (a porta muda com INVENIRE_PG_PORT).
name: invenire

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: invenire
      POSTGRES_PASSWORD: invenire
      POSTGRES_DB: invenire
    ports:
      - "127.0.0.1:${INVENIRE_PG_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invenire -d invenire"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
